<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>サインイン中 — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="doc">
  <section class="signin">
    <span class="mark" aria-hidden="true"><span class="mark-icon"></span></span>
    <h1>Peakaboo</h1>
    <p class="status" id="callback-status" role="status">サインイン中…</p>
    <a href="/" id="callback-back" hidden>トップへ戻る</a>
  </section>
</main>

<script src="/js/api.js"></script>
<script>
'use strict';
// Twitch の implicit grant から戻ったところ。#access_token と state を確かめて session を作る
// Back from Twitch's implicit grant. Checks #access_token and state, then creates the session.
(function () {
  const status = document.getElementById('callback-status');
  // 拒否されたときは error がクエリに来ることがあるので両方読む / On denial the error may arrive in the query, so read both
  const params = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const get = function (key) { return params.get(key) || query.get(key); };

  // URL からトークンを消す（履歴・共有に残さない）/ Drop the token from the URL (keep it out of history and sharing)
  history.replaceState(null, '', location.pathname);

  function fail(text) {
    YTSApi.setStatus(status, text, 'error');
    document.getElementById('callback-back').hidden = false;
  }

  // state は sessionStorage か cookie のどちらかと一致すればよい（読んだら両方消す）
  // state must match either sessionStorage or the cookie (both are cleared once read)
  let expected = null;
  try {
    expected = sessionStorage.getItem('yts_state');
    sessionStorage.removeItem('yts_state');
  } catch (e) {
    expected = null;
  }
  const cookieState = (document.cookie.match(/(?:^|;\s*)yts_state=([0-9a-f]+)/) || [])[1] || null;
  document.cookie = 'yts_state=; Path=/; Max-Age=0; SameSite=Lax; Secure';

  const error = get('error');
  if (error) {
    fail('サインインできませんでした: ' + (get('error_description') || error));
    return;
  }
  const state = get('state');
  if (!state || (state !== expected && state !== cookieState)) {
    fail('サインインの確認に失敗しました（state 不一致）。もう一度サインインしてください。');
    return;
  }
  const token = params.get('access_token');
  if (!token) {
    fail('トークンを受け取れませんでした');
    return;
  }

  YTSApi.api('/api/auth/session', { method: 'POST', body: { token: token } }).then(function () {
    try { sessionStorage.setItem('yts_twitch_token', token); } catch (e) { /* storage blocked: Helix で再サインインを促す / Helix will ask to sign in again */ }
    location.replace('/');
  }, function (e) {
    fail('サインインに失敗しました: ' + YTSApi.errorText(e));
  });
}());
</script>
</body>
</html>
