<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信 / Stream — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header" id="site-header" hidden></header>

<main class="wide">
  <p class="status" id="boot-status" role="status">読み込み中… / Loading…</p>

  <div class="stack" id="stream-view" hidden>
    <!-- 配信の見出しとチャットの状態 / Stream heading and chat state -->
    <section class="card" aria-labelledby="stream-title">
      <div class="card-head">
        <h1 id="stream-title"></h1>
        <button type="button" class="secondary push" id="popout-button">別ウィンドウ / Pop out</button>
      </div>
      <p class="muted" id="stream-meta"></p>
      <div class="chat-state">
        <p id="chat-state-text"></p>
        <button type="button" class="secondary" id="import-button">チャットを取り込む / Import chat</button>
      </div>

      <!-- VOD の選択（vod_id 未設定のとき）/ VOD choice (when vod_id is not set) -->
      <form class="import-panel" id="vod-picker" hidden novalidate>
        <div class="form-row">
          <div class="field">
            <label for="vod-select">VOD の候補 / VOD candidates</label>
            <select id="vod-select"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="vod-url">または URL か ID / Or a URL or ID</label>
            <input id="vod-url" autocomplete="off" placeholder="https://www.twitch.tv/videos/1234567890">
          </div>
          <button type="submit" class="primary" id="vod-confirm">この VOD で取り込む / Import this VOD</button>
          <button type="button" class="secondary" id="vod-cancel">やめる / Cancel</button>
        </div>
      </form>

      <!-- 取り込みの進み具合 / Import progress -->
      <div class="form-row" id="import-progress" hidden>
        <p class="status" id="import-progress-text" role="status" aria-live="polite"></p>
        <button type="button" class="secondary" id="import-cancel">中止 / Cancel</button>
      </div>

      <p class="status" id="page-status" role="status"></p>
      <p class="field-error" id="page-error" role="alert"></p>
    </section>

    <!-- 密度グラフと設定 / Density graph and settings -->
    <section class="card" aria-labelledby="graph-heading">
      <div class="card-head">
        <h2 id="graph-heading">コメントの密度 / Comment density</h2>
      </div>
      <div class="form-row">
        <div class="field narrow">
          <label for="bin-select">ビン幅 / Bin width</label>
          <select id="bin-select">
            <option value="15">15 秒 / 15 s</option>
            <option value="30">30 秒 / 30 s</option>
            <option value="60">60 秒 / 60 s</option>
            <option value="120">120 秒 / 120 s</option>
          </select>
        </div>
        <div class="field narrow">
          <label for="vod-offset">VOD のずれ（秒）/ VOD offset (s)</label>
          <input id="vod-offset" type="number" step="0.1" min="-3600" max="3600" inputmode="decimal" aria-describedby="settings-status">
        </div>
        <div class="field narrow">
          <label for="chat-lag">反応の遅れ（秒）/ Chat lag (s)</label>
          <input id="chat-lag" type="number" step="0.1" min="-3600" max="3600" inputmode="decimal" aria-describedby="settings-status">
        </div>
      </div>
      <p class="status" id="settings-status" role="status"></p>
      <div class="graph-wrap">
        <canvas id="graph" aria-label="コメント密度グラフ（左右キーで移動）/ Comment density graph (arrow keys to move)"></canvas>
      </div>
      <div class="form-row selection-row">
        <p id="selection-label">未選択 / Nothing selected</p>
        <button type="button" class="primary push" id="mark-button" disabled>ここに印 / Mark here</button>
      </div>
    </section>

    <!-- コメントとスタンプ / Comments and stamps -->
    <section class="card" aria-label="一覧 / Lists">
      <div class="tabs" role="tablist" aria-label="一覧の切り替え / Switch list">
        <button type="button" role="tab" id="tab-comments" aria-controls="panel-comments" aria-selected="true">コメント / Comments <span class="muted" id="comment-count"></span></button>
        <button type="button" role="tab" id="tab-stamps" aria-controls="panel-stamps" aria-selected="false" tabindex="-1">スタンプ / Stamps <span class="muted" id="stamp-count"></span></button>
      </div>
      <div class="list-scroll" role="tabpanel" id="panel-comments" aria-labelledby="tab-comments">
        <ul class="row-list comment-list" id="comment-list"></ul>
        <p class="empty" id="comment-empty" hidden></p>
      </div>
      <div class="list-scroll" role="tabpanel" id="panel-stamps" aria-labelledby="tab-stamps" hidden>
        <ul class="row-list stamp-list" id="stamp-list"></ul>
        <p class="empty" id="stamp-empty" hidden>スタンプはまだありません / No stamps yet</p>
      </div>
    </section>
  </div>
</main>

<script src="/js/lib.js"></script>
<script src="/js/bins.js"></script>
<script src="/js/chat-fetch.js"></script>
<script src="/js/api.js"></script>
<script src="/js/graph.js"></script>
<script src="/js/stream.js"></script>
</body>
</html>
