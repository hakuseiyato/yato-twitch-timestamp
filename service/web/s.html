<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信 — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="hdr" id="site-header" hidden></header>

<main class="wide">
  <p class="status" id="boot-status" role="status">読み込み中…</p>

  <div id="stream-view" hidden>
    <!-- パンくず・見出し・メタ行（stream.js の renderHead が埋める）/ Breadcrumb, heading and meta line (filled by renderHead in stream.js) -->
    <nav class="crumb" id="stream-crumb" aria-label="パンくず"></nav>
    <h1 id="stream-title"></h1>
    <div class="meta">
      <span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="stream-meta"></span></span>
      <span id="vod-meta" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M3 10h18"/></svg>VOD <a class="num" id="vod-link" target="_blank" rel="noopener noreferrer"></a></span>
      <span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.3A8 8 0 1 1 21 12z"/></svg>チャット <span id="chat-state-text"></span> · <button type="button" class="link-btn" id="import-button">取り込む</button> <span class="faint" id="chat-fetched"></span></span>
      <span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l-2 7h-8z"/><path d="M8 10v11M16 10v11"/></svg><span id="stamp-meta"></span></span>
      <span class="push"><button type="button" class="link-btn" id="popout-button">コメントを別ウィンドウで ↗</button></span>
    </div>

    <!-- VOD の選択（取り込み・再取り込みの最初）/ VOD choice (first step of import and re-import) -->
    <form class="import-panel" id="vod-picker" hidden novalidate>
      <div class="form-row">
        <div class="field">
          <label for="vod-select">VOD の候補</label>
          <select id="vod-select"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="vod-url">または URL か ID</label>
          <input id="vod-url" autocomplete="off" placeholder="https://www.twitch.tv/videos/1234567890">
        </div>
        <button type="submit" class="btn pri" id="vod-confirm">この VOD で取り込む</button>
        <button type="button" class="btn ghost" id="vod-cancel">やめる</button>
      </div>
    </form>

    <!-- 取り込みの進み具合 / Import progress -->
    <div class="form-row" id="import-progress" hidden>
      <p class="status" id="import-progress-text" role="status" aria-live="polite"></p>
      <button type="button" class="btn" id="import-cancel">中止</button>
    </div>

    <p class="status" id="page-status" role="status"></p>
    <p class="field-error" id="page-error" role="alert"></p>

    <!-- 密度グラフと時刻補正 / Density graph and time correction -->
    <section class="sec" aria-labelledby="graph-heading">
      <div class="sec-h">
        <h2 id="graph-heading">コメントの密度</h2>
        <span class="r">
          <label>ビン <select class="inline" id="bin-select">
            <option value="15">15 秒</option>
            <option value="30">30 秒</option>
            <option value="60">60 秒</option>
            <option value="120">120 秒</option>
          </select></label>
          <label>VOD のずれ <input class="inline" id="vod-offset" type="number" step="0.1" min="-3600" max="3600" inputmode="decimal" aria-describedby="settings-status"> s</label>
          <label>反応の遅れ <input class="inline" id="chat-lag" type="number" step="0.1" min="-3600" max="3600" inputmode="decimal" aria-describedby="settings-status"> s</label>
        </span>
      </div>
      <p class="status" id="settings-status" role="status"></p>
      <div class="gwrap">
        <div class="graph">
          <canvas id="graph" aria-label="コメントの密度（← → で移動）"></canvas>
        </div>
        <div class="selrow">
          <span id="selection-label">未選択</span>
          <span class="faint">← → で移動</span>
          <button type="button" class="btn pri" id="mark-button" disabled>ここに印</button>
        </div>
      </div>
    </section>

    <!-- コメントとスタンプ: 1100px 以上は横並び、未満はタブ（stream.js の syncLayout）/ Comments and stamps: side by side at 1100px and up, tabs below (syncLayout in stream.js) -->
    <div class="tabs" role="tablist" aria-label="一覧の切り替え">
      <button type="button" role="tab" id="tab-comments" aria-controls="panel-comments" aria-selected="true">コメント</button>
      <button type="button" role="tab" id="tab-stamps" aria-controls="panel-stamps" aria-selected="false" tabindex="-1">スタンプ</button>
    </div>
    <div class="lists">
      <div>
        <div class="sec-h"><h2>コメント</h2><span class="cnt" id="comment-count"></span></div>
        <div class="listbox">
          <div class="list-scroll" role="tabpanel" id="panel-comments" aria-labelledby="tab-comments">
            <ul class="rows" id="comment-list"></ul>
            <p class="empty" id="comment-empty" hidden></p>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-h">
          <h2>スタンプ</h2><span class="cnt" id="stamp-count"></span>
          <span class="r"><label class="row"><input type="checkbox" id="stamp-candidates-first">候補を先に</label></span>
        </div>
        <div class="listbox">
          <div class="list-scroll" role="tabpanel" id="panel-stamps" aria-labelledby="tab-stamps" hidden>
            <ul class="rows st" id="stamp-list"></ul>
            <p class="empty" id="stamp-empty" hidden>スタンプはまだありません</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/lib.js"></script>
<script src="/js/bins.js"></script>
<script src="/js/chat-fetch.js"></script>
<script src="/js/api.js"></script>
<script src="/js/graph.js"></script>
<script src="/js/stream.js"></script>
</body>
</html>
