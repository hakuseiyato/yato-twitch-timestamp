<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理 / Admin — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header" id="site-header" hidden></header>

<main>
  <p class="status" id="boot-status" role="status">読み込み中… / Loading…</p>

  <!-- 権限なし / Not allowed -->
  <div class="notice" id="forbidden-view" hidden role="alert">
    <strong>403 権限がありません / 403 Forbidden</strong>
    このページはサイト管理者とチャンネルの owner だけが使えます / This page is only for the site admin and channel owners.
  </div>

  <h1 id="admin-heading" hidden>管理 / Admin</h1>

  <!-- チャンネル作成（サイト管理者）/ Create channel (site admin) -->
  <section class="card" id="create-view" hidden aria-labelledby="create-heading">
    <h2 id="create-heading">チャンネルを作成 / Create channel</h2>
    <form id="create-form" novalidate>
      <div class="form-row">
        <div class="field">
          <label for="create-login">Twitch の login / Twitch login</label>
          <input id="create-login" autocomplete="off" maxlength="25" placeholder="terano_naa" aria-describedby="create-error">
        </div>
        <div class="field">
          <label for="create-display">表示名（任意） / Display name (optional)</label>
          <input id="create-display" autocomplete="off" maxlength="100">
        </div>
        <button type="submit" class="primary" id="create-button">作成 / Create</button>
      </div>
      <p class="field-error" id="create-error" role="alert"></p>
    </form>
    <p class="status" id="create-status" role="status"></p>
  </section>

  <!-- チャンネルごとの会員 / Members per channel -->
  <div class="stack" id="channel-sections"></div>
</main>

<script src="/js/lib.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
