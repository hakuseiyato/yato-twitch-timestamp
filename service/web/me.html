<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="hdr" id="site-header" hidden></header>

<main class="doc">
  <p class="status" id="boot-status" role="status">読み込み中…</p>

  <section id="account-view" hidden aria-labelledby="account-heading">
    <h1 id="account-heading">マイページ</h1>
    <p class="lead"><span id="me-login"></span> としてサインイン中<span class="faint" id="me-via"></span></p>
  </section>

  <section class="sec" id="tokens-view" hidden aria-labelledby="tokens-heading">
    <div class="sec-h"><h2 id="tokens-heading">パネル用トークン</h2></div>
    <p class="help">Premiere / After Effects のパネルや Scout がサーバーに入るときの鍵です。1 台につき 1 つ発行してください。</p>

    <form class="row" id="issue-form" novalidate>
      <input class="in" id="token-label" maxlength="100" autocomplete="off" placeholder="ラベル（例: 編集用 PC）" aria-label="ラベル（任意）">
      <button type="submit" class="btn pri" id="issue-button">発行</button>
    </form>

    <!-- 1 回だけ表示するトークン / Token shown only once -->
    <div class="note" id="token-reveal" hidden>
      <p class="muted" role="alert">新しいトークン — いま一度だけ表示しています。貼り付けてから閉じてください</p>
      <div class="row">
        <input class="in mono" id="token-value" readonly aria-label="発行したトークン">
        <button type="button" class="btn ghost" id="copy-button">コピー</button>
      </div>
      <p class="status" id="copy-status" role="status"></p>
    </div>

    <p class="status" id="tokens-status" role="status"></p>
    <div id="token-list"></div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/me.js"></script>
</body>
</html>
