<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメント — Peakaboo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peakaboo-32.png">
<link rel="apple-touch-icon" href="/icons/peakaboo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="doc pop">
  <!-- 配信のタイトルと日付、親ページへの戻り / Stream title and date, back to the stream page -->
  <div class="crumb">
    <h1 id="popout-title">コメント</h1>
    <a class="push" id="back-link" href="/">配信ページへ</a>
  </div>
  <p class="status" id="boot-status" role="status">読み込み中…</p>
  <p class="field-error" id="page-error" role="alert"></p>
  <div class="sec-h">
    <h2>コメント</h2><span class="cnt" id="filter-count" role="status"></span>
    <span class="r"><input class="in" id="search" type="search" autocomplete="off" placeholder="コメントを検索" aria-label="コメントを検索" aria-describedby="filter-count"></span>
  </div>
  <div class="listbox">
    <div class="list-scroll" id="comment-scroll">
      <ul class="rows" id="comment-list"></ul>
    </div>
  </div>
</main>

<script src="/js/lib.js"></script>
<script src="/js/bins.js"></script>
<script src="/js/api.js"></script>
<script src="/js/comments.js"></script>
</body>
</html>
