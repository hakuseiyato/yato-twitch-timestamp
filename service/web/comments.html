<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメント / Comments — Yato Twitch Timestamp</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="popout">
  <div class="popout-bar">
    <h1 id="popout-title">コメント / Comments</h1>
    <a id="back-link" href="/">親ページへ / Back to stream</a>
  </div>
  <div class="form-row">
    <div class="field">
      <label for="search">検索（本文・名前）/ Search (text, name)</label>
      <input id="search" type="search" autocomplete="off" aria-describedby="filter-count">
    </div>
  </div>
  <p class="status" id="filter-count" role="status"></p>
  <p class="status" id="boot-status" role="status">読み込み中… / Loading…</p>
  <p class="field-error" id="page-error" role="alert"></p>
  <div class="list-scroll" id="comment-scroll">
    <ul class="row-list comment-list" id="comment-list"></ul>
  </div>
</main>

<script src="/js/lib.js"></script>
<script src="/js/bins.js"></script>
<script src="/js/api.js"></script>
<script src="/js/comments.js"></script>
</body>
</html>
